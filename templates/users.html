{% extends "base.html" %}{% block title %}User management{% endblock %}
{% block content %}<h1 class="h2 fw-bold">User management</h1><p class="text-secondary">Admin-only page for basic role management.</p><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Current role</th><th>Update role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td><span class="badge text-bg-{{ 'primary' if u.role=='Admin' else 'secondary' }}">{{ u.role }}</span></td><td><form class="d-flex gap-2" method="post" action="{{ url_for('update_role',user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select class="form-select form-select-sm" name="role"><option value="Member" {{ 'selected' if u.role=='Member' }}>Member</option><option value="Admin" {{ 'selected' if u.role=='Admin' }}>Admin</option></select><button class="btn btn-sm btn-outline-primary">Save</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
